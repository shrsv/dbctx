<?xml version="1.0" encoding="UTF-8"?>
<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="6%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="97%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#1d56f0" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1d56f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d56f0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1584" height="396" rx="20"/>
    </clipPath>
    <style>
      .bold { font-family: 'Liberation Sans', Arial, sans-serif; font-weight: 700; }
      .reg  { font-family: 'Liberation Sans', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1584" height="396" fill="url(#bg)"/>
    <rect width="1584" height="396" fill="url(#redGlow)"/>
    <rect width="1584" height="396" fill="url(#blueGlow)"/>
  </g>
  <rect x="0.75" y="0.75" width="1582.5" height="394.5" rx="19.25"
        fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- 12-column-inspired layout: 80px outer margin, headline on left, brand on right. -->
  <g class="bold">
    <text x="80" y="102" font-size="60" fill="#ef4444">Risk-Aware</text>
    <text x="410" y="102" font-size="60" fill="#f8fafc">AI Code Review</text>

    <rect x="80" y="117" width="322" height="3" fill="#f87171"/>

    <text x="80" y="184" font-size="60" fill="#f8fafc">for</text>
    <text x="164" y="184" font-size="60" fill="#5b8cfb">Business-Critical Systems</text>
    <text x="916" y="184" font-size="60" fill="#f8fafc">.</text>

    <rect x="164" y="199" width="752" height="3" fill="#5b8cfb" opacity="0.85"/>
  </g>

  <!-- Product identity in the top-right, safely away from the profile-photo area. -->
  <g transform="translate(1300,42)">
    <g transform="translate(24,24)">
      <circle r="30" fill="#1E429F" opacity="0.22"/>
      <circle r="25" fill="#111827"/>
      <circle r="25" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
      <circle r="12.5" fill="#60A5FA"/>
      <circle r="6.25" fill="#1E40AF"/>
      <circle cx="-4.4" cy="-4.7" r="3" fill="#ffffff" opacity="0.85"/>
    </g>
    <text x="65" y="35" class="bold" font-size="32">
      <tspan fill="#f8fafc">Live</tspan><tspan fill="#3b82f6">Review</tspan>
    </text>
  </g>

  <!-- CTA and URL share one centered vertical axis. -->
  <g transform="translate(1242,300)">
    <rect width="300" height="56" rx="28" fill="url(#ctaGrad)"/>
    <text x="150" y="36" text-anchor="middle" class="bold" font-size="19" fill="#ffffff">Explore LiveReview</text>
    <path d="M 263 28 L 275 28 M 269 22 L 275 28 L 269 34"
          stroke="#ffffff" stroke-width="2.4" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1542" y="382" text-anchor="end" class="reg" font-size="15" fill="#64748b">
    hexmos.com/livereview
  </text>
</svg>
